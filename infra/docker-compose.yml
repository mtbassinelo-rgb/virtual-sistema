# Servidor da Virtual Cosméticos (Hostinger VPS)
# Dois ambientes no mesmo servidor: teste e produção, cada um com seu banco.
#
# Subir:   docker compose --env-file .env up -d
name: virtual

services:
  db-producao:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtual
      POSTGRES_USER: virtual_admin
      POSTGRES_PASSWORD: ${DB_PRODUCAO_SENHA:?defina no .env}
    volumes:
      - db_producao:/var/lib/postgresql/data
    networks: [interna]

  db-teste:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: virtual
      POSTGRES_USER: virtual_admin
      POSTGRES_PASSWORD: ${DB_TESTE_SENHA:?defina no .env}
    volumes:
      - db_teste:/var/lib/postgresql/data
    networks: [interna]

  # Aplicação web: produção e teste (mesma imagem, bancos e arquivos separados)
  app-producao:
    build: ..
    image: virtual-app:producao
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vc_app:${APP_PRODUCAO_SENHA:?defina no .env}@db-producao/virtual
      PORTAL_URL: ${PORTAL_URL:-}
      # Avisos por e-mail (cadastros e pedidos do site). Sem SMTP configurado, só o WhatsApp e a tela Hoje avisam.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      EMAIL_AVISOS: ${EMAIL_AVISOS:-}
      # WhatsApp por QR Code (servidor interno, sem acesso pela internet)
      WHATSAPP_API_URL: http://vc-whatsapp:8080
      WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-}
      WHATSAPP_WEBHOOK_SEGREDO: ${WHATSAPP_WEBHOOK_SEGREDO:-}
      # Shopee e Mercado Livre direto (dados dos apps criados nas plataformas; só aqui no servidor)
      APP_URL: ${APP_URL:-}
      ML_CLIENT_ID: ${ML_CLIENT_ID:-}
      ML_CLIENT_SECRET: ${ML_CLIENT_SECRET:-}
      SHOPEE_PARTNER_ID: ${SHOPEE_PARTNER_ID:-}
      SHOPEE_PARTNER_KEY: ${SHOPEE_PARTNER_KEY:-}
      MARKETPLACE_SINC_SEGREDO: ${MARKETPLACE_SINC_SEGREDO:-}
    volumes:
      - arquivos_producao:/dados
    depends_on: [db-producao]
    networks:
      interna:
        # nome exclusivo: o Caddy também enxerga a rede do Instituto, que pode ter um serviço com o mesmo nome
        aliases: [vc-app-producao]

  app-teste:
    build: ..
    image: virtual-app:teste
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://vc_app:${APP_TESTE_SENHA:?defina no .env}@db-teste/virtual
    volumes:
      - arquivos_teste:/dados
    depends_on: [db-teste]
    networks:
      interna:
        aliases: [vc-app-teste]

  # HTTPS automático para app.<dominio> (produção) e teste.<dominio>
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?defina no .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - /opt/caddy-extra:/etc/caddy/extra:ro   # sites de outros sistemas da VPS (Instituto Supremo)
    networks: [interna, supremo]

  # WhatsApp por QR Code (Evolution API), só para produção. Não tem porta aberta para a internet:
  # só a aplicação conversa com ele, pela rede interna. Cada número conectado fica salvo no volume whatsapp_sessoes.
  whatsapp:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: "8080"
      SERVER_URL: http://vc-whatsapp:8080
      LANGUAGE: pt-BR
      LOG_LEVEL: ERROR,WARN
      DEL_INSTANCE: "false"
      AUTHENTICATION_API_KEY: ${WHATSAPP_API_KEY:-trocar-no-env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      CONFIG_SESSION_PHONE_CLIENT: Virtual Cosmeticos
      CONFIG_SESSION_PHONE_NAME: Chrome
      QRCODE_LIMIT: "30"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${WHATSAPP_DB_SENHA:-trocar-no-env}@vc-whatsapp-db:5432/evolution?schema=evolution_api
      DATABASE_CONNECTION_CLIENT_NAME: virtual
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://vc-whatsapp-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      # Avisos para o sistema: mensagens novas, histórico, QR Code e conexão (com a chave secreta)
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://vc-app-producao:3000/api/whatsapp/webhook?chave=${WHATSAPP_WEBHOOK_SEGREDO:-}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_APPLICATION_STARTUP: "false"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      WEBHOOK_EVENTS_MESSAGES_SET: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "false"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
    volumes:
      - whatsapp_sessoes:/evolution/instances
    depends_on: [whatsapp-db, whatsapp-redis]
    networks:
      interna:
        aliases: [vc-whatsapp]

  whatsapp-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${WHATSAPP_DB_SENHA:-trocar-no-env}
    volumes:
      - whatsapp_db:/var/lib/postgresql/data
    networks:
      interna:
        aliases: [vc-whatsapp-db]

  whatsapp-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - whatsapp_redis:/data
    networks:
      interna:
        aliases: [vc-whatsapp-redis]

  # A cada 5 minutos: busca os pedidos da Shopee e do Mercado Livre e manda o resumo do dia no WhatsApp do gerente (na hora do parâmetro)
  marketplace-sinc:
    image: curlimages/curl:8.10.1
    restart: unless-stopped
    environment:
      SEGREDO: ${MARKETPLACE_SINC_SEGREDO:-}
    entrypoint: ["sh", "-c", "sleep 60; while true; do curl -sS -m 280 -o /dev/null \"http://vc-app-producao:3000/api/marketplace/sincronizar?chave=$$SEGREDO\" || true; curl -sS -m 60 -o /dev/null \"http://vc-app-producao:3000/api/resumo-diario?chave=$$SEGREDO\" || true; sleep 300; done"]
    depends_on: [app-producao]
    networks: [interna]

  # Backup diário do banco de produção (guarda 30 dias no servidor;
  # a cópia para fora do servidor é configurada em backup.sh)
  backup:
    image: postgres:16
    restart: unless-stopped
    environment:
      PGHOST: db-producao
      PGUSER: virtual_admin
      PGPASSWORD: ${DB_PRODUCAO_SENHA}
      PGDATABASE: virtual
    volumes:
      - ./backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["bash", "-c", "while true; do bash /backup.sh; sleep 86400; done"]
    networks: [interna]

volumes:
  arquivos_producao:
  arquivos_teste:
  db_producao:
  db_teste:
  caddy_dados:
  backups:
  whatsapp_sessoes:
  whatsapp_db:
  whatsapp_redis:

networks:
  interna:
  # Rede compartilhada com o sistema do Instituto Supremo (só o Caddy participa)
  supremo:
    external: true
    name: supremo-web
