name: Publicar
# Botão manual: Actions → Publicar → Run workflow → escolher teste ou produção.
# Entra no servidor por SSH e roda infra/atualizar.sh (baixa a versão do GitHub, aplica as migrações e reinicia).
# Segredos necessários (Settings → Secrets and variables → Actions):
#   VPS_HOST   endereço do servidor (ex.: 179.198.97.37)
#   VPS_USER   usuário SSH (ex.: root)
#   VPS_SSH_KEY chave privada SSH autorizada no servidor (conteúdo inteiro)
#   VPS_PATH   pasta do sistema no servidor (a que contém infra/), ex.: /opt/virtual-sistema
on:
  workflow_dispatch:
    inputs:
      ambiente:
        description: "Onde publicar"
        required: true
        type: choice
        options: [teste, producao]
        default: teste

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar em ${{ inputs.ambiente }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.ambiente }}
    steps:
      - name: Conferir que os testes da versão passaram
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          estado=$(gh api "repos/${{ github.repository }}/actions/workflows/testes.yml/runs?head_sha=$SHA&per_page=1" --jq '.workflow_runs[0].conclusion // "sem_teste"')
          echo "Testes desta versão: $estado"
          [ "$estado" = "success" ] || { echo "Os testes desta versão não passaram (ou ainda estão rodando). Publicação cancelada."; exit 1; }
      - name: Publicar no servidor
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          AMBIENTE: ${{ inputs.ambiente }}
        run: |
          for v in VPS_HOST VPS_USER VPS_SSH_KEY VPS_PATH; do [ -n "${!v}" ] || { echo "Falta o segredo $v"; exit 1; }; done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_publicar && chmod 600 ~/.ssh/id_publicar
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_publicar -o BatchMode=yes "$VPS_USER@$VPS_HOST" "cd '$VPS_PATH/infra' && ./atualizar.sh '$AMBIENTE'"
          rm -f ~/.ssh/id_publicar
