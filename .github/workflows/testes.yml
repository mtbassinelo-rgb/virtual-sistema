name: Testes

# Roda a cada envio para o GitHub. Nada vai para o ar se algo falhar.
on:
  push:
  pull_request:

jobs:
  banco:
    name: Regras do banco
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: vc_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:teste@localhost:5432/vc_teste
    steps:
      - uses: actions/checkout@v4
      - name: Cliente do Postgres
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Aplicar migrações duas vezes (não pode quebrar)
        run: ./db/migrar.sh && ./db/migrar.sh
      - name: Testes do banco (banco limpo)
        run: |
          psql "$DATABASE_URL" -q -c "drop schema app cascade; drop schema if exists teste cascade; drop table public.migracoes; drop role if exists vc_app; drop role if exists vc_sync;" || true
          ./db/testar.sh

  aplicacao:
    name: Aplicação web
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: virtual
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_ADMIN: postgresql://postgres:teste@localhost:5432/virtual
      DATABASE_URL: postgresql://vc_app:app-teste@localhost:5432/virtual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar tipos
        run: npm run typecheck
      - name: Compilar
        run: npm run build
      - name: Preparar banco e usuários de teste
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          DATABASE_URL=$DATABASE_URL_ADMIN ./db/migrar.sh
          psql "$DATABASE_URL_ADMIN" -c "alter role vc_app login password 'app-teste'"
          psql "$DATABASE_URL_ADMIN" -f scripts/dados-exemplo.sql
          SENHA=senha-de-teste-123 node scripts/criar-usuario.mjs gerente@teste.local "Gerente Teste" gerente
          SENHA=senha-de-teste-123 node scripts/criar-usuario.mjs keila@teste.local "Keila Teste" vendedora Keila
      - name: Teste de fumaça (sobe o sistema, entra e navega)
        run: |
          npm run start -- -p 3000 > servidor.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3000/login > /dev/null && break; sleep 1; done
          node scripts/teste-fumaca.mjs http://localhost:3000
      - name: Log do servidor (se falhar)
        if: failure()
        run: cat servidor.log || true

  imagem:
    name: Imagem para o servidor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Montar a imagem Docker da aplicação
        run: docker build -t virtual-app:ci .
      - name: A imagem inicia
        run: |
          docker run -d --name app -e DATABASE_URL=postgresql://x:y@localhost/z -p 3000:3000 virtual-app:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/login > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/login | grep -q "Entrar" && echo "Imagem respondeu."
          docker exec app node -e "require('@node-rs/argon2'); require('pg'); console.log('Dependências do script de usuários presentes.')"
      - name: Configuração do servidor (Caddy e Docker Compose)
        run: |
          docker run --rm -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" -e DOMINIO=exemplo.com caddy:2 caddy validate --config /etc/caddy/Caddyfile
          cd infra && cp .env.exemplo .env && docker compose --env-file .env config -q && rm .env
          bash -n instalar.sh && bash -n atualizar.sh && bash -n backup.sh
